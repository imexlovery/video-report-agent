h1,h2,h3,p{margin:0}h1,h2,h3{color:var(--heading);text-wrap:pretty}h1{font-size:34px;line-height:1.45;font-weight:750;letter-spacing:0}.subtitle{text-wrap:balance;font-size:21px;font-weight:600;line-height:1.6;margin-top:12px;color:#4c5965}.lead{margin-top:20px;line-height:1.9}.meta{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.8}.meta a{color:inherit;text-decoration:underline}
.report-nav{counter-reset:report-nav;position:fixed;z-index:3;left:calc(50vw - 724px);top:32px;width:272px;max-height:calc(100vh - 64px);overflow:auto;padding:8px 8px 8px 0;background:transparent}.report-nav-title{display:block;padding:0 12px 20px;color:var(--heading);font-size:18px;font-weight:650}.report-nav>a{counter-increment:report-nav;display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:center;min-height:49px;margin-bottom:7px;padding:12px 16px;border:1px solid #e6ebee;border-left:4px solid transparent;border-radius:5px;background:#ffffffaa;color:#596873;font-size:15px;line-height:1.5;text-decoration:none}.report-nav>a::before{content:counter(report-nav,decimal-leading-zero);color:#93a0aa;font-size:12px;font-variant-numeric:tabular-nums}.report-nav>a:hover{background:var(--blue-wash);color:var(--blue)}.report-nav>a[aria-current="location"]{background:#fff;border-left-color:#dc8e65;transform:translateX(8px);box-shadow:0 6px 18px #263e5010;color:var(--ink);font-weight:650}

section{margin-top:42px}section>h2{display:flex;flex-wrap:nowrap;align-items:baseline;gap:8px 12px;font-size:24px;font-weight:750;line-height:1.55;padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:21px}.num{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;flex-shrink:0;min-width:28px;height:28px;padding:0 5px;margin-top:5px;background:#424e58;border-radius:50%;color:white;font-size:16px;line-height:1;font-weight:650;font-variant-numeric:tabular-nums}h3{font-size:19px;font-weight:700;line-height:1.6;margin:27px 0 12px}h3:before{content:"";display:inline-block;width:8px;height:8px;margin-right:9px;margin-bottom:2px;border-radius:50%;background:var(--dot,var(--orange))}p+p{margin-top:14px}strong{font-weight:650;color:var(--heading)}ul,ol{padding-left:1.4em;margin:16px 0}li+li{margin-top:8px}li::marker{color:var(--accent)}a{color:var(--blue);text-underline-offset:4px}a:hover{color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.section-title{flex:1 1 0;min-width:0}.section-time{display:block;flex:0 0 auto;white-space:nowrap;margin-left:auto;font-size:12px;font-weight:400;line-height:1.6;color:#666666;font-variant-numeric:tabular-nums;overflow-wrap:normal}
.section-time a{color:inherit}.section-time a:hover{color:var(--accent)}
.callout{margin:25px 0;padding:20px 24px;background:var(--blue-wash);border:0;border-radius:7px;color:var(--blue)}.callout h3{margin:0 0 9px;color:var(--blue);font-size:18px}.callout h3:before{display:none}.callout strong{color:inherit}.keyline{margin:25px 0;padding:20px 24px;background:var(--wash);border:0;border-radius:6px;line-height:1.85}.keyline p,.keyline blockquote{margin:0}.keyline cite{display:block;font-size:13px;font-style:normal;margin-top:10px;color:var(--muted)}
.cards,.comparison,.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin:26px 0}.card,.comparison>div,.category{min-width:0;padding:22px 24px;background:#fff;border-radius:9px;box-shadow:0 4px 16px #25384b12}.card h3,.comparison h3,.category h3{margin:0 0 11px;font-size:18px}.card p,.category p,.comparison p{font-size:16px;line-height:1.85}.categories{grid-template-columns:repeat(auto-fit,minmax(195px,1fr))}.category{border-top:3px solid var(--line);padding:18px 20px}.category ul{padding-left:1.2em}
.categories.categories-stacked{grid-template-columns:minmax(0,1fr);gap:18px}.categories-stacked>.category{padding:18px 20px}.categories-stacked>.category ul{margin:10px 0 0}.categories-stacked>.category li+li{margin-top:5px}
/* 长解释分类：复用 category，标题与列表圆点分层，允许自然篇幅。 */
.categories.categories-detailed{grid-template-columns:minmax(0,1fr);gap:28px}.categories-detailed>.category{--category-tone:#2c6e83;padding:26px 28px;background:#fff;border:0;border-left:3px solid var(--category-tone);box-shadow:0 3px 16px #273c4910}.categories-detailed>.category>h3{font-size:22px;line-height:1.55;margin:0 0 12px}.categories-detailed>.category>h3:before{display:none}.categories-detailed .category-meta{font-size:14px;color:var(--muted);margin:0 0 16px}.categories-detailed h4{font-size:18px;font-weight:650;line-height:1.6;color:var(--heading);margin:24px 0 10px}.categories-detailed p,.categories-detailed li{font-size:17px;line-height:1.85}.categories-detailed>.category>:last-child{margin-bottom:0}
.categories-detailed>.category[data-tone="rust"]{--category-tone:#a64c35}.categories-detailed>.category[data-tone="ochre"]{--category-tone:#75602b}.categories-detailed>.category[data-tone="plum"]{--category-tone:#77558a}.categories-detailed>.category[data-tone="sage"]{--category-tone:#456e51}.categories-detailed>.category[data-tone="rose"]{--category-tone:#8e516d}.categories-detailed .category-number{font-size:15px;font-weight:600;color:var(--category-tone);margin-right:12px;font-variant-numeric:tabular-nums}.categories-detailed li::marker{color:#8b959e}

.steps{list-style:none;counter-reset:step;padding:0;margin:24px 0}.steps>li{counter-increment:step;position:relative;padding-left:38px;margin:23px 0}.steps>li:before{content:counter(step);position:absolute;left:0;top:3px;width:25px;height:25px;border-radius:50%;background:var(--accent);color:white;text-align:center;line-height:25px;font-size:14px;font-weight:650}.steps h3{margin:0 0 7px}.steps h3:before{display:none}
.stats,.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px;margin:26px 0}.stats{padding:24px 0;border-block:1px solid var(--line);text-align:center}.stat+.stat{border-left:1px solid var(--line)}.tile{text-align:center;padding:20px 14px;border-radius:8px;box-shadow:0 3px 12px #25384b0e}.value{display:block;font-size:28px;font-weight:700;color:var(--accent);line-height:1.4;font-variant-numeric:tabular-nums}.caption{display:block;font-size:14px;line-height:1.65;color:var(--muted);margin-top:8px}
.bars{margin:26px 0;display:grid;gap:16px}.bar{display:grid;gap:7px}.bar-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}.bar-name{font-size:15px;line-height:1.6;color:var(--muted)}.bar-value{font-size:15px;font-weight:650;color:var(--heading);font-variant-numeric:tabular-nums}.bar-track{display:block;height:12px;border-radius:3px;background:#eff6fa;overflow:hidden}.bar-fill{display:block;height:100%;border-radius:3px;background:var(--bar-color,#7ac5ef)}.bar-highlight{--bar-color:#ffb38a}
pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;background:#f5f7f9;border-radius:6px}code{font-family:ui-monospace,monospace;font-size:.9em}table{border-collapse:separate;border-spacing:0;width:100%;max-width:100%;margin:24px auto;font-size:15px;line-height:1.75;overflow-wrap:break-word;border:1px solid #dce9f1;border-radius:7px;overflow:hidden}th,td{text-align:left;vertical-align:top;min-width:5em;padding:16px;border-bottom:1px solid var(--line)}th{font-weight:650;color:var(--blue);background:var(--blue-wash)}thead th{font-size:14px}tbody{background:var(--paper)}tbody th{background:transparent;color:var(--heading);border-right:1px solid #e6eef3}tbody tr:last-child>th,tbody tr:last-child>td{border-bottom:0}td:first-child{color:var(--heading);font-weight:550}.table-details{table-layout:auto}.table-details tbody th{min-width:7.5em}.table-compact{width:auto}.table-number{text-align:right;font-variant-numeric:tabular-nums}td>ul,td>ol{margin:0;padding-left:1.2em}td li+li{margin-top:6px}td p+p{margin-top:8px}
.evidence-rows{list-style:none;counter-reset:evidence-row;display:grid;gap:31px;margin:25px 0 34px;padding:0}.evidence-rows>li{counter-increment:evidence-row;display:grid;grid-template-columns:minmax(150px,186px) minmax(0,1fr);gap:22px;margin:0}.evidence-topic:before{content:counter(evidence-row,decimal-leading-zero);display:block;color:var(--accent);font-size:12px;font-weight:700;line-height:1.2}.evidence-topic h3{font-size:17px;line-height:1.5;margin:5px 0 4px}.evidence-topic h3:before{display:none}.evidence-body{min-width:0}.evidence-judgment{margin:0;color:var(--blue);font-weight:650;line-height:1.55}.evidence-detail{margin:8px 0 0;font-size:15px;line-height:1.72}
.cycle-map{margin:26px 0}.cycle-map svg{display:block;width:100%;height:auto}.cycle-node{fill:#edf7fc;stroke:#d6eaf3;stroke-width:1}.cycle-edge{fill:none;stroke:#6997ad;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.cycle-title{font-size:17px;font-weight:650;fill:var(--heading)}.cycle-note{font-size:14px;fill:#426779}.cycle-label{font-size:14px;fill:#426779}.cycle-map figcaption{margin-top:8px;font-size:14px;color:var(--muted)}
details{margin-top:24px;font-size:13px;color:var(--muted)}.intro+details~section:first-of-type{margin-top:24px}summary{cursor:pointer;width:fit-content;color:var(--heading)}details[open] summary{margin-bottom:12px}.video-description-text{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}footer{margin-top:24px;font-size:12px;color:var(--muted)}.paper{overflow-wrap:anywhere}
footer{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}.footer-link,.footer-link:hover{color:inherit;text-decoration:underline}
@media print{body{background:white}.paper{margin:0 auto;box-shadow:none}.callout,.card,.category,.tile{break-inside:avoid}h2,h3{break-after:avoid}}
@media print{.categories-detailed>.category{break-inside:auto}.categories-detailed h4{break-after:avoid}}
@media(min-width:1195px) and (max-width:1448px){.paper{margin-left:310px;margin-right:24px}.report-nav{left:24px}}
@media(max-width:1194px){.report-nav{display:none}}
@media print{.report-nav{display:none}}
</style>

<body><main class="paper">
<header class="intro">
<h1>{{TITLE}}</h1>
<!-- 副标题无新增角度时可删除；导语固定保留，用一段话概括视频讨论对象、核心问题与报告展开方式，不重复副标题。题头不要放组件配额、虚构指标或装饰标签。ATTRIBUTION 固定按“平台；UP 主；《原视频完整标题》；可点击的原视频裸 URL”依次完整展示，已有哪项就展示哪项，不重列推广标签。 -->
<p class="subtitle">{{SUBTITLE}}</p>
<p class="lead">{{LEAD}}</p>
<p class="meta">{{ATTRIBUTION}}</p>
</header>
<!-- 独立使用：没有简介时删除此占位符，提供简介时按 Skill 填入原文折叠块。仅产品调用明确要求后处理时原样保留一次。 -->
{{VIDEO_DESCRIPTION}}
<!-- 默认直接进入内容，按有效信息量、关系复杂度和用户用途选择详略，时长仅为提示。短内容不设摘要与地图；主图、对照或步骤直接承担正文。长文确需导航时，BODY 开头可放下列结构；只写章节短标签，序号由模板生成，链接目标必须对应后文章节 id。桌面导航固定在纸面左侧页外，不占正文空间；窄屏、打印与 920px 长图自动隐藏，不另生成正文内回退目录。概览仅在有独立用途时出现，使用无编号自然中文标题，不放 span.num。多个正文大章节从 1 连续编号；单一单元或紧凑模块可省略编号。易读表达就地解释术语，精读保留必要依据，均不缩小字号或重复扩写。Profile 不进入可见页面。
<nav class="report-nav" aria-label="章节导航"><span class="report-nav-title">目录</span><a href="#s1">第一个章节短标签</a><a href="#s2">第二个章节短标签</a></nav>
-->
<!-- 共用视觉语法，所有 Profile 均可使用；以下为可选结构指引，不是待填的固定章节：
Timeline / Turning Points：ol > li 按事件排列，每项写事件或阶段、变化与后果；转折可用 strong 标识。事件日期属于内容，不重复视频定位时间戳。
Before → Trigger → After：使用 comparison 对照同一对象前后状态，以邻近短段或过程链说明触发事件；不能用布局暗示来源未支持的因果。
Issue Matrix：table 的行对应议题，列按实际人物及立场、依据组织，必要时增加共识或未解决问题；th 标明列义，未表态如实标注。
Evidence Chain：ol 或 ol.steps 连接问题、方法、证据、结果和限制，适用条件靠近对应节点；材料缺失时不强填节点。
Decision Tree：使用嵌套 ul/li，在分支开头写明条件，再写动作与结果；不另绘连线。普通线性步骤继续使用 ol。
关系表达：只复用下方已有组件，或用步骤、对照、表格和文字写清对象、方向、边界与条件，不自建图形。
颜色与线条沿用现有组件，不按卡片奇偶或节点顺序轮换；预计变化在文字中就地标注性质。
这些结构直接承担内容；复用现有样式，不依赖外部脚本或图库，不要求每份报告使用全部语法。 -->
<!-- 正文从语义组织生成：section/h2（多个大章节时用 span.num 放连续序号，后接 span 标题文本）、h3/p；可选 callout、keyline、cards/card、comparison、categories/category、ol.steps/li、stats、tiles/tile、bars/bar。不存在必填章节或必用组件。表格默认占满所在容器并自动分配列宽；短标签与短数值的小表可用 table-compact 居中收窄，不为凑满宽度制造大块空白。长说明先按语义分成短段或条目，仍影响跨行比较时移到表外；只有实际渲染出现拥挤才按内容设置 colgroup，不默认固定列宽。柱图仅用于正文必须看见的量级差异，不为每节数字各画一组。同一可比序列保持同色，需要突出来源支持的重点才加 bar-highlight，不按顺序轮换颜色。柱图按 div.bars > div.bar 组织，每个 bar 为 div.bar-head（span.bar-name + span.bar-value）加 span.bar-track>span.bar-fill；bar-fill 的 width 即占比，bar-track 占满整行宽度，同组共用刻度（最大项给 width:100%）。短项目用原生列表、表格或紧凑分栏，名称与数值同行；ol.steps 仅供需要展开解释的步骤选用，圆圈编号与布局沿用模板。p、li 或卡片用 data-source-units 绑定实际支持内容的 ID。 -->
<!-- 并列类别内容长短悬殊、主要逐项阅读时，在普通 .categories 上加 .categories-stacked；共同字段需要横向对照时仍用并排卡或表格。 -->
<!-- 以下示例的内容与编号均为合成展示，生成时逐处替换为实际来源的原生 ID，不沿用样例映射。
逐项判断与依据示例：少量事项各有长依据与独立判断、主要逐项阅读时使用；需要跨项对齐比较共同字段时保留表格。不为填版式重复写“属实”“正确”等状态词；只有状态差异影响判断时才在正文就地说明。编号只作定位，不表示时间或排名。真实内容按来源替换。
<ol class="evidence-rows">
  <li data-source-units="unit-000001"><div class="evidence-topic"><h3>事项甲</h3></div><div class="evidence-body"><p class="evidence-judgment">影响集中在交付时间</p><p class="evidence-detail">保留来源支持的时间、条件和影响范围。</p></div></li>
  <li data-source-units="unit-000002"><div class="evidence-topic"><h3>事项乙</h3></div><div class="evidence-body"><p class="evidence-judgment">目前不能确定影响程度</p><p class="evidence-detail">说明已有依据及缺失的信息，不补造结论。</p></div></li>
</ol>
-->
<!-- 分类详解示例：仅用于需要展开的并列类型，数量和字段按来源增减；短分类沿用普通 categories。
白底配左侧 3px 彩线和轻微阴影；data-tone 可选 rust、ochre、plum、sage、rose，省略时为蓝青色。颜色只区分类别；同类在全文保持一致，不表示排名或风险等级。可选 span.category-number 显示定位序号。
类型标题可设唯一 id 供长文导航定位；不另加重复总览，不嵌套卡片。标题、概括和要点分别绑定实际支持它们的来源 ID。
<div class="categories categories-detailed">
  <article class="category" data-tone="rust">
    <h3 id="category-a" data-source-units="unit-000001">类型名称</h3>
    <p class="category-meta" data-source-units="unit-000001">代表对象或适用范围（有必要时保留）</p>
    <p data-source-units="unit-000001">来源支持的核心特点与必要限定。</p>
    <ul>
      <li data-source-units="unit-000002"><strong>关键特点</strong> — 对应依据与解释。</li>
      <li data-source-units="unit-000003"><strong>成立条件</strong> — 来源实际说明的条件。</li>
    </ul>
    <h4>需要独立展开的对象或案例（按需保留）</h4>
    <p data-source-units="unit-000004">保留理解所需的机制、例子或转折。</p>
  </article>
</div>
-->

结构、坐标、路径、marker 形状和样式保持原样，只替换节点文字、关系文字与来源 ID；同页复用时唯一化组件 ID 及引用，不增减节点或按文字重排几何。
文字放不下或关系不适配时，用现有步骤、表格或列表表达。

<script>
(() => {
  const links = [...document.querySelectorAll('.report-nav>a')];
  const entries = links.map(link => ({link, target:document.getElementById(link.hash.slice(1))})).filter(entry => entry.target);
  if (!entries.length) return;
  function updateCurrent() {
    let current = entries[0];
    for (const entry of entries) {
      if (entry.target.getBoundingClientRect().top <= 160) current = entry;
    }
    if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2) current = entries[entries.length - 1];
    for (const entry of entries) {
      if (entry === current) entry.link.setAttribute('aria-current', 'location');
      else entry.link.removeAttribute('aria-current');
    }
  }
  window.addEventListener('scroll', updateCurrent, {passive:true});
  window.addEventListener('resize', updateCurrent);
  updateCurrent();
})();
