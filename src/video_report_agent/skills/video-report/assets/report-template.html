<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=900">
<title>{{TITLE}}</title>
<meta name="video-report-theme" content="local">
<script>
(() => {
  const setting = document.querySelector('meta[name="video-report-theme"]').content;
  const restorePrefix = '#report-theme-restore=';
  const storageKey = 'video-report-theme';
  const system = window.matchMedia('(prefers-color-scheme: dark)');
  const root = document.documentElement;
  let choice = setting;
  let button;

  if (setting === 'local') {
    try {
      choice = localStorage.getItem(storageKey);
    } catch {
      // Some browsers disable storage for standalone files.
    }
  }

  function applyTheme() {
    const dark = choice === 'dark' || (choice !== 'light' && system.matches);
    root.dataset.reportTheme = dark ? 'dark' : 'light';
    if (button) button.setAttribute('aria-pressed', String(dark));
  }

  applyTheme();
  system.addEventListener('change', applyTheme);
  document.addEventListener('DOMContentLoaded', () => {
    button = document.querySelector('.report-theme-toggle');
    if (!button) return;
    applyTheme();
    button.hidden = false;
    if (setting !== 'local' && location.hash.startsWith(restorePrefix)) {
      const state = new URLSearchParams(location.hash.slice(restorePrefix.length));
      window.addEventListener('load', () => {
        const url = new URL(window.location.href);
        url.hash = state.get('hash') || '';
        history.replaceState(history.state, '', url.href);
        window.scrollTo({ top: Number(state.get('top')), behavior: 'instant' });
        if (state.get('focus') === 'true') button.focus({ preventScroll: true });
      }, { once: true });
    }
    button.addEventListener('click', (event) => {
      choice = root.dataset.reportTheme === 'dark' ? 'light' : 'dark';
      if (setting !== 'local') {
        // The hosted report is sandboxed. Its own URL saves the preference.
        const url = new URL(window.location.href);
        const state = new URLSearchParams({
          hash: url.hash, top: String(window.scrollY), focus: String(event.detail === 0),
        });
        url.searchParams.set('report_theme', choice);
        url.hash = restorePrefix + state;
        window.location.replace(url.href);
        return;
      }
      try {
        localStorage.setItem(storageKey, choice);
      } catch {
        // The current page can still switch when storage is unavailable.
      }
      applyTheme();
    });
  });
})();
</script>

.report-theme-toggle {
  position: fixed;
  z-index: 4;
  top: 16px;
  right: 12px;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--paper);
  color: var(--heading);
  cursor: pointer;
}
.report-theme-toggle:not([hidden]) { display: grid; place-items: center; }
.report-theme-toggle:hover { background: var(--blue-wash); }
.report-theme-toggle::before {
  content: "";
  width: 20px;
  height: 20px;
  border: 2px solid currentColor;
  border-radius: 50%;
  background: linear-gradient(90deg, currentColor 50%, transparent 50%);
}
@media (pointer: coarse) {
  .report-theme-toggle { right: 4px; width: 60px; height: 60px; }
  .report-theme-toggle::before { transform: scale(1.3); }
}
@media (forced-colors: active) {
  .report-theme-toggle::before { forced-color-adjust: none; color: ButtonText; }
}
@media print { .report-theme-toggle:not([hidden]) { display: none; } }

@media screen {
  :root[data-report-theme="dark"] {
    color-scheme: dark;
    --canvas: #15181c;
    --paper: #20242a;
    --surface: #292f36;
    --ink: #d6dbe1;
    --heading: #f0f2f5;
    --muted: #aab4bf;
    --accent: #ffae82;
    --orange: #ec986a;
    --line: #404953;
    --blue: #99c9f2;
    --blue-wash: #233746;
    --wash: #3a3021;
    --warm-text: #e6cc9a;
    --rule-blue: #465b6c;
    --diagram-ink: #b0cddd;
    --diagram-edge: #82a9be;
  }

  [data-report-theme="dark"] ::selection { background: #684631; }
  [data-report-theme="dark"] .paper {
    box-shadow: 0 8px 30px #080a0d66;
  }
  [data-report-theme="dark"] .paper::before,
  [data-report-theme="dark"] .paper::after {
    background: linear-gradient(90deg, #e7a078, #8e849e);
  }
  [data-report-theme="dark"] .subtitle,
  [data-report-theme="dark"] .section-time { color: var(--muted); }

  [data-report-theme="dark"] .report-nav > a {
    background: var(--paper);
    color: var(--muted);
    border-color: #343c45;
    border-left-color: transparent;
  }
  [data-report-theme="dark"] .report-nav > a::before { color: #9ba9b6; }
  [data-report-theme="dark"] .report-nav > a:hover {
    background: var(--blue-wash);
    color: var(--blue);
  }
  [data-report-theme="dark"] .report-nav > a[aria-current="location"] {
    background: #302c2b;
    border-left-color: var(--accent);
    box-shadow: 0 6px 18px #090a0d55;

<!-- 默认直接进入内容，按有效信息量、关系复杂度和用户用途选择详略，时长仅为提示。短内容不设摘要与地图；主图、对照或步骤直接承担正文。长文确需导航时，BODY 开头可放下列结构；只写章节短标签，序号由模板生成，链接目标必须对应后文章节 id。桌面导航固定在纸面左侧页外，不占正文空间；窄屏、打印与 920px 长图自动隐藏，不另生成正文内回退目录。概览仅在有独立用途时出现，使用无编号自然中文标题，不放 span.num。多个正文大章节从 1 连续编号；单一单元或紧凑模块可省略编号。易读表达就地解释术语，精读保留必要依据，均不缩小字号或重复扩写。Profile 不进入可见页面。

<!-- 共用视觉语法，所有 Profile 均可使用；以下为可选结构指引，不是待填的固定章节：

Before → Trigger → After：使用 comparison 对照同一对象前后状态，以邻近短段或过程链说明触发事件；不能用布局暗示来源未支持的因果。

Decision Tree：使用嵌套 ul/li，在分支开头写明条件，再写动作与结果；不另绘连线。普通线性步骤继续使用 ol。
关系表达：只复用下方已有组件，或用步骤、对照、表格和文字写清对象、方向、边界与条件，不自建图形。
颜色与线条沿用现有组件，不按卡片奇偶或节点顺序轮换；预计变化在文字中就地标注性质。
这些结构直接承担内容；复用现有样式，不依赖外部脚本或图库，不要求每份报告使用全部语法。 -->
<!-- 正文从语义组织生成：section/h2（多个大章节时用 span.num 放连续序号，后接 span 标题文本）、h3/p；可选 callout、keyline、cards/card、comparison、categories/category、ol.steps/li、stats、tiles/tile、bars/bar。不存在必填章节或必用组件。表格默认占满所在容器并自动分配列宽；少量类别加单一计数优先 stats stats-counts；多维度比较才用表格，确需小表时用 table-compact 居中收窄。长说明先按语义分成短段或条目，仍影响跨行比较时移到表外；只有实际渲染出现拥挤才按内容设置 colgroup，不默认固定列宽。柱图仅用于正文必须看见的量级差异，不为每节数字各画一组。同一可比序列保持同色，需要突出来源支持的重点才加 bar-highlight，不按顺序轮换颜色。柱图按 div.bars > div.bar 组织，每个 bar 为 div.bar-head（span.bar-name + span.bar-value）加 span.bar-track>span.bar-fill；bar-fill 的 width 即占比，bar-track 占满整行宽度，同组共用刻度（最大项给 width:100%）。短项目用原生列表或紧凑分栏；列表名称与数值同行，小型计数分栏的数字在上、说明在下；ol.steps 仅供需要展开解释的步骤选用，圆圈编号与布局沿用模板。p、li 或卡片用 data-source-units 绑定实际支持内容的 ID。 -->

两对象各两期，条长共用最大值 50 的尺度；同一期用色保持一致。

指标先行、长条件顺读；metric-row 使用紧凑间距，不套原小样的大片空行。

<div class="reading-items"><article class="reading-item" data-source-units="example-001"><h3>一个需要完整保留的对象名称</h3><div class="reading-fields"><div><strong>背景</strong><p>原文提供的人物、环境与条件。</p></div><div><strong>问题</strong><p>该对象具体回答什么，保留必要限定。</p></div></div></article></div>

<div class="reading-items reading-items-layered"><p class="layer-progress">数据接入 <span aria-hidden="true">→</span> 处理校验 <span aria-hidden="true">→</span> 结果交付</p><article class="reading-item" data-source-units="example-001"><h3>数据接入</h3><div class="reading-fields"><div><strong>复用的能力</strong><p>接收不同来源的数据，保留原有格式和来源信息。</p></div><div><strong>适用需求</strong><p>需要统一入口，后续处理仍由项目负责。</p></div></div></article><article class="reading-item" data-source-units="example-002"><h3>处理校验</h3><div class="reading-fields"><div><strong>复用的能力</strong><p>在接入结果上完成字段校验、异常记录和处理步骤。</p></div><div><strong>适用需求</strong><p>需要复用连续处理过程，并自行安排交付方式。</p></div></div></article><article class="reading-item" data-source-units="example-003"><h3>结果交付</h3><div class="reading-fields"><div><strong>复用的能力</strong><p>在处理结果上增加版本记录和交付接口。</p></div><div><strong>适用需求</strong><p>需要复用完整流程并保留实际输出。</p></div></div></article></div>
-->
<!-- Standard 关系组件示例：只替换来源支持的内容与 ID，缺失必要关系时回到文字。

<script>
(() => {
  const links = [...document.querySelectorAll('.report-nav>a')];
  const entries = links.map(link => ({link, target:document.getElementById(link.hash.slice(1))})).filter(entry => entry.target);
  if (!entries.length) return;
  function updateCurrent() {
    let current = entries[0];
    for (const entry of entries) {
      if (entry.target.getBoundingClientRect().top <= 160) current = entry;
    }
    if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2) current = entries[entries.length - 1];
    for (const entry of entries) {
      if (entry === current) entry.link.setAttribute('aria-current', 'location');
      else entry.link.removeAttribute('aria-current');
    }
  }
  window.addEventListener('scroll', updateCurrent, {passive:true});
  window.addEventListener('resize', updateCurrent);
  updateCurrent();
})();
</script>
